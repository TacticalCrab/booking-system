global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "booking-system"
    metrics_path: "/actuator/prometheus"

    static_configs:
      - targets:
          - "host.docker.internal:8080"

  - job_name: "postgres"
    static_configs:
      - targets:
          - "postgres-exporter:9187"

  - job_name: "redis"
    static_configs:
      - targets:
          - "redis-exporter:9121"

  - job_name: "rabbitmq"
    static_configs:
      - targets:
          - "rabbitmq:15692"