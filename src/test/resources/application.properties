spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

outbox.poll-delay-ms=60000

# Rabbit publishing is covered with isolated mocks; integration tests do not
# provision a broker and should not start background AMQP or scheduled work.
spring.rabbitmq.listener.simple.auto-startup=false
spring.task.scheduling.enabled=false

